<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cap10works | Adnan’s IT Portfolio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap">
<style>
:root{--bg:#02060a;--ink:#cfeee0;--mute:#6f9a8a;--card:rgba(4,18,15,.8);--line:#0d3b30;--g:#00ff9c;--c:#00e5ff;--r:#ff3860;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth;background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.65 "Share Tech Mono",ui-monospace,Menlo,monospace;overflow-x:hidden}
#rain{position:fixed;inset:0;width:100%;height:100%;opacity:.22;z-index:0;pointer-events:none}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:60;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.03) 0,rgba(255,255,255,.03) 1px,transparent 1px,transparent 3px)}
h1,h2,h3{font-family:Orbitron,"Segoe UI",sans-serif;margin:0;line-height:1.1}
a{color:var(--c)}
:focus-visible{outline:3px solid var(--r);outline-offset:3px}
.hero{position:relative;z-index:1;height:100vh;height:100svh;min-height:560px;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%}
.hud{position:absolute;left:0;right:0;top:calc(14px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;padding:0 clamp(16px,4vw,48px);font-size:13px;color:var(--mute);letter-spacing:.12em}
.hud b{color:var(--g);font-weight:400}
.intro{position:absolute;left:0;right:0;bottom:0;padding:0 clamp(20px,5vw,64px) clamp(24px,6vh,52px);background:linear-gradient(to top,var(--bg) 40%,transparent)}
#term{white-space:pre-wrap;color:var(--g);font-size:clamp(13px,1.9vw,16px);min-height:5.2em;margin:0 0 12px;text-shadow:0 0 8px rgba(0,255,156,.5)}
#term::after{content:"█";animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.intro h1{font-size:clamp(34px,7.5vw,92px);font-weight:900;color:#eafff6;text-shadow:2px 0 var(--r),-2px 0 var(--c);animation:glitch 4.5s infinite}
@keyframes glitch{0%,91%,100%{text-shadow:2px 0 var(--r),-2px 0 var(--c);transform:none}93%{text-shadow:-6px 0 var(--r),6px 0 var(--c);transform:translateX(3px)}96%{text-shadow:6px 0 var(--r),-6px 0 var(--c);transform:translateX(-3px)}}
#tag{margin:12px 0 18px;max-width:50ch;color:var(--mute);font-size:clamp(14px,2vw,18px)}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;padding:12px 24px;border:1px solid var(--g);color:#02060a;background:var(--g);text-decoration:none;font-weight:700;letter-spacing:.06em;box-shadow:0 0 22px rgba(0,255,156,.55);clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px))}
.btn.ghost{background:transparent;color:var(--g);box-shadow:none}
main{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:56px clamp(20px,5vw,40px) 30px}
section{padding:36px 0;border-top:1px solid var(--line)}
h2{font-size:clamp(22px,4.2vw,34px);font-weight:900;margin-bottom:18px;color:var(--g);text-shadow:0 0 14px rgba(0,255,156,.45)}
h2::before{content:"root@adnan:~$ ";color:var(--mute);font:400 .5em "Share Tech Mono",monospace;vertical-align:middle}
.about{max-width:62ch}
.chips{display:flex;flex-wrap:wrap;gap:10px;list-style:none;padding:0;margin:0}
.chips li{background:var(--card);border:1px solid var(--line);padding:7px 14px}
.chips li:nth-child(3n+1){border-color:var(--g);box-shadow:0 0 10px rgba(0,255,156,.2)}
.chips li:nth-child(3n+2){border-color:var(--c);box-shadow:0 0 10px rgba(0,229,255,.2)}
.chips li:nth-child(3n){border-color:var(--r);box-shadow:0 0 10px rgba(255,56,96,.2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.card{position:relative;display:block;background:var(--card);border:1px solid var(--line);padding:22px;text-decoration:none;color:inherit;transition:box-shadow .2s,border-color .2s,transform .12s;transform-style:preserve-3d}
.card::before,.card::after{content:"";position:absolute;width:16px;height:16px;border:2px solid var(--g)}
.card::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.card::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.card:hover{border-color:var(--g);box-shadow:0 0 28px rgba(0,255,156,.35)}
.card h3{font-size:19px;margin-bottom:8px;color:#eafff6}
.card p{margin:0 0 12px;color:var(--mute);font-size:15px}
.card small{color:var(--c)}
.tag{position:absolute;top:10px;right:12px;font-size:11px;color:var(--g)}
.links{list-style:none;padding:0;margin:20px 0 0;display:flex;gap:22px;flex-wrap:wrap}
footer{position:relative;z-index:1;padding:26px 20px 50px;text-align:center;color:var(--mute);font-size:13px}
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s,transform .7s}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.intro h1,#term::after{animation:none}.rv{opacity:1;transform:none;transition:none}#rain{display:none}}
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<header class="hero">
  <canvas id="c" aria-hidden="true"></canvas>
  <div class="hud"><span>SYS://ADNAN</span><span><b>●</b> SECURE CONNECTION</span></div>
  <div class="intro">
    <p id="term"></p>
    <h1>Hi, I’m Adnan.</h1>
    <p id="tag"></p>
    <div class="cta"><a class="btn" href="#projects">VIEW PROJECTS</a><a class="btn ghost" href="#contact">CONTACT</a></div>
  </div>
</header>
<main>
  <section><h2>About</h2><p class="about" id="about"></p></section>
  <section><h2>Skills</h2><ul class="chips" id="skills"></ul></section>
  <section id="projects"><h2>Projects</h2><div class="grid" id="proj"></div></section>
  <section id="contact"><h2>Contact</h2><a class="btn" id="mail" href="#">EMAIL ME</a><ul class="links" id="links"></ul></section>
</main>
<footer>// adnan © 2026 // connection secure</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ===== EDIT YOUR DETAILS HERE ===== */
var ME={
  tagline:"IT student from India, 5th semester. Learning web development and open to remote work, internships and entry-level roles.",
  about:"I’m an IT student who learns by building. Right now I’m learning HTML, CSS, JavaScript, Python and SQL, and I put every project on GitHub. I’m looking for a team where I can contribute, learn fast and take real responsibility. Give me a task and I’ll ship it.",
  skills:["HTML & CSS (learning)","JavaScript (learning)","Python (learning)","SQL (learning)","Git & GitHub","Microsoft Office","Google Workspace","Quick learner"],
  email:"workforbadcaptain@gmail.com",
  links:[{l:"GitHub",u:"https://github.com/cap10works"},{l:"LinkedIn",u:"https://www.linkedin.com/in/adnan-bhat-0414b2332/"},{l:"workforbadcaptain@gmail.com",u:"mailto:workforbadcaptain@gmail.com"}],
  projects:[
    {t:"This Portfolio",d:"The interactive 3D site you are looking at right now.",s:"HTML, CSS, JavaScript, Three.js",u:"https://github.com/cap10works/cap10works.github.io"},
    {t:"To-Do List App",d:"Add and remove tasks in the browser. Tasks stay saved after a refresh.",s:"HTML, CSS, JavaScript",u:"https://github.com/cap10works/todo-app"},
    {t:"My First Site",d:"My first webpage, built while learning HTML and CSS.",s:"HTML, CSS",u:"https://github.com/cap10works/my-first-site"}
  ]
};
/* ================================== */
function $(i){return document.getElementById(i)}
var reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
$("tag").textContent=ME.tagline;$("about").textContent=ME.about;$("mail").href="mailto:"+ME.email;
ME.skills.forEach(function(s){var li=document.createElement("li");li.textContent=s;$("skills").appendChild(li)});
ME.links.forEach(function(x){var li=document.createElement("li"),a=document.createElement("a");a.href=x.u;a.textContent=x.l;a.target="_blank";a.rel="noopener";li.appendChild(a);$("links").appendChild(li)});
ME.projects.forEach(function(p,i){var a=document.createElement("a");a.className="card";a.href=p.u;a.target="_blank";a.rel="noopener";
 a.innerHTML='<span class="tag"></span><h3></h3><p></p><small></small>';
 a.children[0].textContent="[ 0"+(i+1)+" ]";a.children[1].textContent=p.t;a.children[2].textContent=p.d;a.children[3].textContent=p.s;$("proj").appendChild(a)});

/* terminal boot text */
(function(){
 var L=["> booting portfolio.sys ...","> user: adnan // role: it_student","> status: open_to_work","> access: granted"],t=$("term"),li=0,ci=0,out="";
 if(reduce){t.textContent=L.join("\n");return}
 var iv=setInterval(function(){
  if(li>=L.length){clearInterval(iv);return}
  if(ci<L[li].length){out+=L[li][ci++];}else{out+="\n";li++;ci=0}
  t.textContent=out;
 },28);
})();

/* matrix rain */
(function(){
 if(reduce)return;
 var cv=$("rain"),x=cv.getContext("2d"),fs=16,drops=[],chars="01ABCDEF<>/{}$#=+*".split("");
 function size(){cv.width=innerWidth;cv.height=innerHeight;drops=[];for(var i=0;i<Math.ceil(cv.width/fs);i++)drops[i]=Math.random()*cv.height/fs}
 size();addEventListener("resize",size);
 setInterval(function(){
  x.fillStyle="rgba(2,6,10,.1)";x.fillRect(0,0,cv.width,cv.height);
  x.fillStyle="#00ff9c";x.font=fs+"px monospace";
  for(var i=0;i<drops.length;i++){
   x.fillText(chars[(Math.random()*chars.length)|0],i*fs,drops[i]*fs);
   if(drops[i]*fs>cv.height&&Math.random()>.975)drops[i]=0;
   drops[i]++;
  }
 },60);
})();

/* 3D globe, rings, packets */
(function(){
 if(typeof THREE==="undefined")return;
 var cv=$("c"),R=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:true});
 R.setPixelRatio(Math.min(devicePixelRatio,2));
 var S=new THREE.Scene(),C=new THREE.PerspectiveCamera(50,1,.1,100);C.position.z=9;
 var G=new THREE.Group();S.add(G);
 var gg=new THREE.IcosahedronGeometry(2.2,2);
 var globe=new THREE.Mesh(gg,new THREE.MeshBasicMaterial({color:0x00ff9c,wireframe:true,transparent:true,opacity:.35}));
 var nodes=new THREE.Points(gg,new THREE.PointsMaterial({color:0x00e5ff,size:.07}));
 var core=new THREE.Mesh(new THREE.IcosahedronGeometry(1.05,1),new THREE.MeshBasicMaterial({color:0xff3860,wireframe:true,transparent:true,opacity:.55}));
 G.add(globe,nodes,core);
 var rings=[];
 [[3.1,.3,0],[3.5,1.2,.6],[3.9,-.5,1.1]].forEach(function(p,i){
  var g=new THREE.Group(),r=p[0];
  g.add(new THREE.Mesh(new THREE.TorusGeometry(r,.012,8,200),new THREE.MeshBasicMaterial({color:i==1?0xff3860:0x00e5ff,transparent:true,opacity:.7})));
  var pk=new THREE.Mesh(new THREE.SphereGeometry(.09,12,12),new THREE.MeshBasicMaterial({color:0xffffff}));g.add(pk);
  g.rotation.x=p[1];g.rotation.y=p[2];G.add(g);rings.push({g:g,pk:pk,r:r,s:.6+i*.25,a:i*2});
 });
 var N=1800,pos=new Float32Array(N*3);
 for(var k=0;k<N;k++){var d=6+Math.random()*9,u=Math.random()*6.283,v=Math.acos(2*Math.random()-1);pos[k*3]=d*Math.sin(v)*Math.cos(u);pos[k*3+1]=d*Math.sin(v)*Math.sin(u);pos[k*3+2]=d*Math.cos(v)}
 var sg=new THREE.BufferGeometry();sg.setAttribute("position",new THREE.BufferAttribute(pos,3));
 var stars=new THREE.Points(sg,new THREE.PointsMaterial({color:0x7dffc8,size:.035,transparent:true,opacity:.8}));S.add(stars);
 function size(){var w=cv.clientWidth,h=cv.clientHeight;R.setSize(w,h,false);C.aspect=w/h;C.updateProjectionMatrix();
  var wide=w>820;G.position.set(wide?2.6:0,wide?.2:1.6,0);G.scale.setScalar(wide?1:.75)}
 addEventListener("resize",size);size();
 var mx=0,my=0,gy=0,gx=0,t=0;
 addEventListener("pointermove",function(e){mx=e.clientX/innerWidth*2-1;my=e.clientY/innerHeight*2-1});
 (function loop(){
  if(!reduce)t+=.01;
  globe.rotation.y=nodes.rotation.y=t*.4;globe.rotation.x=nodes.rotation.x=t*.12;
  core.rotation.y=-t*.7;core.rotation.z=t*.3;
  var s=1+Math.sin(t*3)*.02;core.scale.setScalar(s);
  rings.forEach(function(o){o.a+=reduce?0:.012*o.s;o.pk.position.set(Math.cos(o.a)*o.r,Math.sin(o.a)*o.r,0)});
  stars.rotation.y=t*.03;stars.rotation.x=t*.015;
  gy+=(mx*.5-gy)*.05;gx+=(my*.3-gx)*.05;G.rotation.y=gy;G.rotation.x=gx;
  R.render(S,C);requestAnimationFrame(loop);
 })();
})();

/* tilt cards + reveal on scroll */
(function(){
 if(matchMedia("(hover:hover)").matches&&!reduce){
  [].forEach.call(document.querySelectorAll(".card"),function(c){
   c.addEventListener("pointermove",function(e){var r=c.getBoundingClientRect(),px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;
    c.style.transform="perspective(700px) rotateX("+(-py*10)+"deg) rotateY("+(px*12)+"deg) translateZ(6px)"});
   c.addEventListener("pointerleave",function(){c.style.transform=""});
  });
 }
 var secs=document.querySelectorAll("section");
 [].forEach.call(secs,function(s){s.classList.add("rv")});
 if(reduce||!("IntersectionObserver" in window)){[].forEach.call(secs,function(s){s.classList.add("in")});return}
 var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}})},{threshold:.12});
 [].forEach.call(secs,function(s){io.observe(s)});
})();
</script>
</body>
</html>
